# *************************************
# *  RoyalCTW | Discord (JDA Proxy)   *
# *************************************

# ────────────────────────────
# CONNECTION
# ────────────────────────────
ENABLED: false
TOKEN: ""
GUILD-ID: ""
SLASH-COMMANDS: true
PREFIX-COMMANDS: true
PREFIX: "!"
SEND-WEBHOOK-EVENTS: true
BUTTON-SECRET-ENV: "ROYALCTW_BRIDGE_SECRET"

# ────────────────────────────
# BRIDGE
# ────────────────────────────
BRIDGE:
  ENABLED: true
  CHANNEL-IN: "royalctw:discord:in"
  CHANNEL-OUT: "royalctw:discord:out"
  SIGN-EVENTS: true
  SECRET-ENV: "ROYALCTW_BRIDGE_SECRET"
  QUEUE-MAX: 500
  DROP-AFTER-SECONDS: 120

# ────────────────────────────
# SYNC
# ────────────────────────────
SYNC:
  CODE-TTL-SECONDS: 300
  COOLDOWN-SECONDS: 30
  REDEEM-COOLDOWN-SECONDS: 5

# ────────────────────────────
# STAFF-AUTH
# ────────────────────────────
STAFF-AUTH:
  GEO:
    STAFF-PERMISSION: ioriproxy.staff
    MASK-IP: true
    GEO-LOOKUP: true
    GEO-URL: "http://ip-api.com/json/%ip%?fields=status,country,countryCode"
    TOKEN-TTL-SECONDS: 900
    GRACE-SECONDS: 2
    WEBHOOK-ENABLE: true
  FLOW:
    ENABLED: true
    NOTIFY:
      CHANNEL-ID: ""
    DM:
      ENABLED: true
    OVERRIDE:
      ROLE-IDS: []
      MC-PERMISSION: "ioriproxy.staffauth.override"
      LOG-CHANNEL-ID: ""
  ACCOUNT:
    CREATE:
      PERMISSION: "royalctw.staffreg.create"
      REQUIRE-STEP-UP: true
      LOG-PASSWORD: false
    PASSWORD:
      ENABLED: true
      ALGORITHM: "ARGON2ID"
      MIN-LENGTH: 12
      MUST-CHANGE-ON-FIRST-LOGIN: true
    REQUIRE-DISCORD-LINK: true
    ONE-DISCORD-PER-ACCOUNT: true
    ADMIN-ASSIGN:
      ENABLED: true
      ACCEPT-ID: true
      ACCEPT-USERNAME: true
      REQUIRE-OWNER-CONFIRM: true
      CONFIRM-TTL-SECONDS: 300
    UNLINKED:
      NOTICE-ON-JOIN: true
      REMINDER-SECONDS: 120
      ALLOW-PASSWORD-LOGIN: true
      STEP-UP-FALLBACK: "PASSWORD"

# ────────────────────────────
# AUTH
# ────────────────────────────
AUTH:
  MODES: [DISCORD, PASSWORD]
  TRUST:
    EXPIRE-DAYS: 0
    STORE: [IP, COUNTRY, REGION, CITY]
  CHANGE-DETECTION:
    COUNTRY: true
    REGION: true
    CITY: false
    VPN-PROXY: true
  ON-CHANGE:
    STRIP-PERMISSIONS: true
    KEEP-RANK-TAG: true
    BLOCK-STAFF-COMMANDS: true
    CHALLENGE-TTL-SECONDS: 120
    KICK-AFTER-SECONDS: 0
    ALLOW-PASSWORD-FALLBACK: true
  ENFORCE-OP-AND-WILDCARD: true

# ────────────────────────────
# FAILS
# ────────────────────────────
FAILS:
  MAX-FAILS: 3
  WINDOW-SECONDS: 900
  ACTION: "BAN"
  BAN-DURATION: "24h"
  REVOKE-SESSIONS: true
  ALERT-DISCORD: true
  UNBAN-BUTTON: true

# ────────────────────────────
# STEP-UP
# ────────────────────────────
STEP-UP:
  ENABLED: true
  TTL-SECONDS: 300
  METHOD: "DISCORD"
  CONSOLE: true
  PERMANENT-BAN: true
  COMMANDS:
    - "op"
    - "deop"
    - "lp"
    - "luckperms"
    - "stop"
    - "restart"
    - "reload"
    - "staffreg"
  PERMISSION-NODES:
    - "*"
    - "minecraft.command.op"

# ────────────────────────────
# CHANNELS
# ────────────────────────────
CHANNELS:
  STAFF-AUTH: ""
  SECURITY: ""
  STAFF-CHAT: ""
  PUNISHMENTS: ""
  STATUS: ""
  WELCOME: ""
  GOODBYE: ""
  BOOST: ""

# ────────────────────────────
# COMMANDS
# ────────────────────────────
COMMANDS:
  CHANNEL-ID: ""
  ROLE-IDS: []
  BAN: true
  TEMPBAN: true
  MUTE: true
  TEMPMUTE: true
  WARN: true
  KICK: true

# ────────────────────────────
# STAFF-CHAT
# ────────────────────────────
STAFF-CHAT:
  ENABLED: true
  CHANNEL-ID: ""
  WEBHOOK-URL: ""
  AUTO-CREATE-WEBHOOK: false
  USERNAME: "%player%"
  AVATAR-URL: "https://visage.surgeplay.com/bust/152/%player%"
  FORMAT: "**[%server%]** %message%"

# ────────────────────────────
# WELCOME / GOODBYE / BOOST
# ────────────────────────────
WELCOME:
  ENABLED: true
  CHANNEL-ID: ""

GOODBYE:
  ENABLED: true
  CHANNEL-ID: ""

BOOST:
  ENABLED: true
  CHANNEL-ID: ""

# ────────────────────────────
# STATUS
# ────────────────────────────
STATUS:
  ENABLED: true
  CHANNEL-ID: ""

# ────────────────────────────
# PUNISHMENTS
# ────────────────────────────
PUNISHMENTS:
  ENABLED: true
  DEFAULT-CHANNEL-ID: ""
  BAN:
    CHANNEL-ID: ""
  TEMPBAN:
    CHANNEL-ID: ""
  MUTE:
    CHANNEL-ID: ""
  TEMPMUTE:
    CHANNEL-ID: ""
  WARN:
    CHANNEL-ID: ""
  KICK:
    CHANNEL-ID: ""

# ────────────────────────────
# BUTTONS
# ────────────────────────────
BUTTONS:
  SIGN-CUSTOM-ID: true
  DISABLE-AFTER-USE: true
  ONLY-OWNER-CAN-PRESS: true
  APPROVE:
    LABEL: "Approve"
    EMOJI: "✅"
    STYLE: "SUCCESS"
  DENY:
    LABEL: "Deny"
    EMOJI: "⛔"
    STYLE: "DANGER"
  NOT-ME:
    LABEL: "No fui yo"
    EMOJI: "🚨"
    STYLE: "DANGER"
  CONFIRM-LINK:
    LABEL: "Confirmar vínculo"
    EMOJI: "🔗"
    STYLE: "PRIMARY"
  UNBAN:
    LABEL: "Unban"
    EMOJI: "🔓"
    STYLE: "SECONDARY"

# ────────────────────────────
# REPLIES
# ────────────────────────────
REPLIES:
  SYNC-OK: "✅ Linked to **%player%**."
  SYNC-INVALID: "❌ Invalid or expired code."
  SYNC-ALREADY: "❌ Account already linked."
  SYNC-UNAVAILABLE: "❌ Sync unavailable."
  SYNC-RATE: "❌ Too many attempts. Try again shortly."
  LINK-CONFIRMED: "✅ Linked to **%player%**."
  LINK-NOT-OWNER: "❌ This link request is not for your account."
  LINK-EXPIRED: "❌ Link request expired."
  STAFF-AUTH-APPROVED: "✅ Approved by **%actor%**."
  STAFF-AUTH-DENIED: "⛔ Denied by **%actor%**."
  STAFF-AUTH-NOT-ME: "🚨 Reported by **%actor%**. Account locked and sessions revoked."
  STAFF-AUTH-SELF: "❌ You cannot approve your own staff-auth request."
  STAFF-AUTH-NOT-OWNER: "❌ Only the linked Discord account can answer this request."
  STAFF-AUTH-INVALID: "❌ Token invalid or already used."
  STAFF-AUTH-ROLE: "❌ Missing Discord staff role."
  UNBAN-OK: "🔓 **%player%** unbanned by **%actor%**."
  BOT-DISABLED: "Bot disabled."

# ────────────────────────────
# EMBEDS
# ────────────────────────────
EMBEDS:
  STAFF-AUTH-NOTIFY:
    COLOR: "#F1C40F"
    AUTHOR-NAME: "RoyalCTW | Staff Auth"
    AUTHOR-ICON-URL: ""
    TITLE: "Cambio de lugar · %player%"
    DESCRIPTION: |
      🛡️ **Login de staff pendiente de aprobación** (aviso al staff)

      👤 **Player:** %player%
      🆔 **UUID:** %uuid%
      🌐 **IP (masked):** %ip%
      📍 **Ahora:** %country%
      ↩️ **Antes:** %previous_country%
    FOOTER: "%player% · staff-auth · notify"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  STAFF-AUTH:
    COLOR: "#F1C40F"
    AUTHOR-NAME: "RoyalCTW | Staff Auth"
    AUTHOR-ICON-URL: ""
    TITLE: "Cambio de lugar · %player%"
    DESCRIPTION: |
      🛡️ **Confirma que eres tú**

      👤 **Player:** %player%
      🆔 **UUID:** %uuid%
      🌐 **IP (masked):** %ip%
      📍 **Ahora:** %country%
      ↩️ **Antes:** %previous_country%

      Usa los botones de abajo (**Approve** / **Deny**).
    FOOTER: "%player% · staff-auth · dm"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  STAFF-REG:
    COLOR: "#3498DB"
    AUTHOR-NAME: "RoyalCTW | Staff"
    TITLE: "Staff Discord linked"
    DESCRIPTION: |
      ✅ **%player%** vinculó su Discord (%discord%).

      El login solo se pedirá de nuevo si cambia el país o el lugar.
    FOOTER: "staff-auth"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  STAFF-CREATED:
    COLOR: "#2ECC71"
    AUTHOR-NAME: "RoyalCTW | Staff"
    TITLE: "Staff registrado"
    DESCRIPTION: |
      🆕 **%actor%** registró a **%player%**.

      🆔 **UUID:** %uuid%
      🔗 **Discord:** pendiente de vincular
    FOOTER: "staff-auth"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  LINK-CONFIRM:
    COLOR: "#3498DB"
    AUTHOR-NAME: "RoyalCTW | Staff"
    TITLE: "¿Confirmas este vínculo?"
    DESCRIPTION: |
      🔗 **%actor%** quiere vincular tu Discord a la cuenta **%player%**.

      Si eres tú, pulsa **Confirmar vínculo**. Si no, ignora este mensaje.
    FOOTER: "staff-auth"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  UNLINKED:
    COLOR: "#E67E22"
    AUTHOR-NAME: "RoyalCTW | Staff Auth"
    TITLE: "Discord sin vincular · %player%"
    DESCRIPTION: |
      ⚠️ **%player%** entró sin Discord vinculado.

      Debe vincularlo con `/sync` o pedir a un admin que lo asigne.
    FOOTER: "staff-auth"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  STEP-UP:
    COLOR: "#E67E22"
    AUTHOR-NAME: "RoyalCTW | Staff Auth"
    TITLE: "Acción sensible · %player%"
    DESCRIPTION: |
      🔐 **%player%** quiere ejecutar una acción protegida.

      🖥️ **Servidor:** %server%
      🌐 **IP (masked):** %ip%
      ⏱ **Válido:** %duration%

      Pulsa **Approve** / **Deny**.
    FOOTER: "%player% · step-up"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  SECURITY-ALERT:
    COLOR: "#E74C3C"
    AUTHOR-NAME: "RoyalCTW | Seguridad"
    TITLE: "🚨 No fui yo · %player%"
    DESCRIPTION: |
      El dueño reportó un login que no reconoce.

      👤 **Player:** %player%
      🌐 **IP (masked):** %ip%
      📍 **Lugar:** %city%, %region%, %country%
      🔒 Cuenta bloqueada y sesiones revocadas.
    FOOTER: "security"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  LOGIN-FAIL-BAN:
    COLOR: "#E74C3C"
    AUTHOR-NAME: "RoyalCTW | Seguridad"
    TITLE: "Baneo por seguridad · %player%"
    DESCRIPTION: |
      ⛔ **%player%** falló la contraseña **%fails%** veces.

      🌐 **IP (masked):** %ip%
      📍 **Lugar:** %city%, %region%, %country%
      ⏱ **Duración:** %duration%
    FOOTER: "security"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

  WELCOME:
    COLOR: "#2ECC71"
    AUTHOR-NAME: "RoyalCTW"
    TITLE: "Bienvenido a %guild%"
    DESCRIPTION: "👋 %mention% (**%user%**) · miembros: **%members%**"
    FOOTER: "RoyalCTW · Discord"
    THUMBNAIL-URL: ""
    TIMESTAMP: true

  GOODBYE:
    COLOR: "#E74C3C"
    AUTHOR-NAME: "RoyalCTW"
    TITLE: "Salida de %guild%"
    DESCRIPTION: "👋 **%user%** salió del Discord · miembros: **%members%**"
    FOOTER: "RoyalCTW · Discord"
    THUMBNAIL-URL: ""
    TIMESTAMP: true

  BOOST:
    COLOR: "#F47FFF"
    AUTHOR-NAME: "RoyalCTW"
    TITLE: "¡Nuevo boost!"
    DESCRIPTION: "🚀 **%booster%** impulsó **%guild%** · boosts: **%boosts%**"
    FOOTER: "RoyalCTW · Discord"
    TIMESTAMP: true

  STATUS:
    COLOR: "#5865F2"
    AUTHOR-NAME: "RoyalCTW"
    TITLE: "Estado · %server%"
    DESCRIPTION: |
      🖥️ **Servidor:** %server%
      📡 **En línea:** %server_online%
      👥 **Jugadores (backend):** %server_players%
      🌐 **Network online:** %online%
      🛠️ **Mantenimiento (scope):** %maintenance%
    FOOTER: "RoyalCTW · /status"
    TIMESTAMP: true

  PUNISHMENT:
    COLOR: "#E67E22"
    AUTHOR-NAME: "RoyalCTW · Moderación"
    TITLE: "%type% · %player%"
    DESCRIPTION: |
      👤 **Jugador:** %player%
      🛠️ **Tipo:** %type%
      ⏱ **Duración:** %duration%
      📝 **Razón:** %reason%
      👮 **Staff:** %actor%
    FOOTER: "RoyalCTW"
    THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
    TIMESTAMP: true

# ────────────────────────────
# COMMUNITY
# ────────────────────────────
PANELS:
  ENABLED: false
  support:
    CHANNEL-ID: ""
    EMBED:
      COLOR: "#5865F2"
      TITLE: "Soporte"
      DESCRIPTION: "Abre un ticket o usa el menú rápido."
    COMPONENTS:
      - TYPE: BUTTON
        ID: open
        LABEL: "Abrir ticket"
        STYLE: PRIMARY
        ACTION: "OPEN_TICKET_MENU"
      - TYPE: STRING_SELECT
        ID: quick
        PLACEHOLDER: "Acceso rápido"
        OPTIONS:
          - { LABEL: "Vincular cuenta", VALUE: link, ACTION: "LINK_ACCOUNT" }
          - { LABEL: "Reglas", VALUE: rules, ACTION: "REPLY:RULES" }

TICKETS:
  ENABLED: false
  SETTINGS:
    MAX-OPEN-PER-USER: 1
    COOLDOWN-SECONDS: 120
    CLOSE-CONFIRMATION: true
    DELETE-AFTER-SECONDS: 60
    LOG-CHANNEL-ID: ""
  CATEGORIES:
    general:
      NAME: "Soporte"
      EMOJI: "📩"
      DESCRIPTION: "Incidencias generales"
      DISCORD-CATEGORY-ID: ""
      STAFF-ROLE-IDS: []
      NAME-FORMAT: "ticket-%number%"
      MODAL:
        ENABLED: false
        LABEL: "Motivo"
        PLACEHOLDER: "Describe brevemente…"
        MIN-LENGTH: 8
        MAX-LENGTH: 256

GIVEAWAYS:
  ENABLED: false
  SETTINGS:
    MIN-UPDATE-INTERVAL-SECONDS: 30
    REQUIRE-LINKED-MC: true
    DEFAULT-ROLE-REQUIREMENTS: []
