# *************************************
# *    IoriProxy | Webhook reports     *
# *************************************
# ~ Placeholders: %id% %reporter% %target% %player% %reason% %server%
# ~ %player% = target (avatar). También <…>

# ────────────────────────────
# CONFIGURACIÓN DE DISCORD WEBHOOK
# ────────────────────────────
# Puedes usar el avatar-url
#  · https://minotar.net/helm/%player%/128.png
# Para usar la cabeza del jugador, si no puedes usar:
#  · https://visage.surgeplay.com/bust/152/%player% para usar la mitad de tu skin

# ────────────────────────────
# CONNECTION
# ────────────────────────────
ENABLED: false
URL: ""
USERNAME: "IoriProxy | Reports"
AVATAR-URL: "https://visage.surgeplay.com/bust/152/%player%"

# ────────────────────────────
# MESSAGE
# ────────────────────────────
CONTENT: "⚠️ **¡NUEVO REPORTE!**"

# ────────────────────────────
# EMBED
# ────────────────────────────
EMBED:
  COLOR: "#E74C3C"
  TIMESTAMP: true

  AUTHOR:
    NAME: "IoriProxy | Reports"
    URL: ""
    ICON-URL: ""

  TITLE: "Reporte #%id%"
  TITLE-URL: ""

  DESCRIPTION: |
    🚨 **Nuevo reporte**

    👤 **Autor:** %reporter%
    🎯 **Reportado:** %target%
    📝 **Motivo:** %reason%
    🌎 **Servidor:** %server%

    *Resolver in-game:* `/reports resolve %id%`

  THUMBNAIL-URL: "https://visage.surgeplay.com/bust/152/%player%"
  IMAGE-URL: ""

  FOOTER: "%target% · %server%"
  FOOTER-ICON-URL: "https://visage.surgeplay.com/face/%player%"
