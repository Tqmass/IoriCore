# *************************************
# *     RoyalCTW | Maintenance        *
# *************************************
# ~ Comandos: messages/{lang}.yml

# ────────────────────────────
# GENERAL
# ────────────────────────────
DEFAULT-REASON: Mantenimiento en curso
KICK-NON-WHITELISTED: true
BYPASS-PERMISSION: ioriproxy.maintenance.bypass

# ────────────────────────────
# MOTD
# ────────────────────────────
MOTD:
  OVERRIDE: true
  SHOW-END-TIMER: true
  MODERN:
    - |-
      <reset>           <aqua><bold>RoyalCTW</bold></aqua> <gray>NETWORK</gray> <aqua>ゝ</aqua> <gray>[1.8 - 1.21]</gray>
      <reset>            <dark_red>✗</dark_red> <red>¡Estamos en mantenimiento!</red>
    - |-
      <reset>           <aqua><bold>RoyalCTW</bold></aqua> <gray>NETWORK</gray> <aqua>ゝ</aqua> <gray>[1.8 - 1.21]</gray>
      <reset>            <dark_red>✗</dark_red> <red>¡En mantenimiento!, volvemos pronto.</red>
  LEGACY:
    - |-
      &b&lRoyalCTW &7NETWORK &bゝ &7[1.8 - 1.21]
      &4✗ &c¡Estamos en mantenimiento!
    - |-
      &b&lRoyalCTW &7NETWORK &bゝ &7[1.8 - 1.21]
      &4✗ &c¡En mantenimiento!, volvemos pronto.
  TIMER-MODERN:
    - |-
      <reset>           <aqua><bold>RoyalCTW</bold></aqua> <gray>NETWORK</gray> <aqua>ゝ</aqua> <gray>[1.8 - 1.21]</gray>
      <reset>            <dark_red>✗</dark_red> <red>¡Volvemos en </red><aqua><time></aqua><red>!</red>
  TIMER-LEGACY:
    - |-
      &b&lRoyalCTW &7NETWORK &bゝ &7[1.8 - 1.21]
      &4✗ &c¡Volvemos en &b<time>&c!

# ────────────────────────────
# PLAYER-LIST
# ────────────────────────────
PLAYER-LIST:
  ENABLED: true
  COUNT-MESSAGE: "<dark_red>✗ <bold>MANTENIMIENTO</bold>"
  COUNT-TIMER-MESSAGE: "<dark_red>✗ Volvemos en: <aqua><time>"
  HOVER:
    - "<aqua><italic>¡No te quedes sin ver las novedades!"
    - "          <blue><italic>discord.royalctw.com"
  HOVER-TIMER:
    - "<red>Servidor en mantenimiento"
    - "<yellow>Vuelve en <time>"
  SAMPLE-PLAYERS: []

# ────────────────────────────
# KICK
# ────────────────────────────
ALLOW-DURING-MAINTENANCE:
  - lobby

KICK:
  REDIRECT-LOBBY: true
  DESCRIPTION: |
    <aqua><bold>RoyalCTW</bold></aqua> <gray>NETWORK</gray> <aqua>ゝ</aqua> <dark_red><bold>MANTENIMIENTO</bold></dark_red>

    <aqua><italic>¡Actualmente nos encontramos cerrados!</italic></aqua>

    <yellow><italic>¡Únete a nuestro Discord!</italic></yellow> <dark_gray>|</dark_gray> <blue><italic>discord.royalctw.com</italic></blue>
    <aqua><italic>¡Para ver las nuevas novedades!</italic></aqua>
  DESCRIPTION-LEGACY: |
    &b&lRoyalCTW &7NETWORK &bゝ &4&lMANTENIMIENTO

    &b&o¡Actualmente nos encontramos cerrados!

    &e&o¡Únete a nuestro Discord! &8| &9&odiscord.royalctw.com
    &b&o¡Para ver las nuevas novedades!

# ────────────────────────────
# COUNTDOWN
# ────────────────────────────
# ~ Textos: messages/{lang}.yml (MAINTENANCE.COUNTDOWN.*)
COUNTDOWN:
  ENABLED: true
  INTERVALS-SECONDS:
    - 60
    - 30
    - 15
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1
  ACTIONBAR: true
  TITLE: true

# ────────────────────────────
# MODES
# ────────────────────────────
# ~ Vacío = auto desde servidores del proxy (lobby-1 → lobby).
MODES: {}
