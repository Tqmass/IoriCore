name: IoriCore
version: "${version}"
main: us.iorilabs.bukkit.IoriCorePlugin
api-version: "1.13"
author: IoriLabs
description: IoriCore backend (Bukkit/Paper).
softdepend:
  [
    PlaceholderAPI,
    LuckPerms,
    LiteBans,
    Vault,
    Geyser-Spigot,
    floodgate,
    Apollo-Bukkit,
    Apollo,
    nLogin,
    ViaVersion,
    Essentials,
  ]
commands:
  ioricore:
    description: Root IoriCore command.
    aliases: [icore]
  ranks:
    description: Open the Rank List menu / manage ranks.
    aliases: [rank]
    permission: ioricore.ranks
  grant:
    description: Grant a rank to a player.
    permission: ioricore.ranks.grant
  ungrant:
    description: Remove a rank grant from a player.
    permission: ioricore.ranks.ungrant
  grants:
    description: List rank grants for a player.
    permission: ioricore.ranks.grants
  ban:
    description: Ban a player.
    aliases: [tempban]
    permission: ioricore.punish.ban
  mute:
    description: Mute a player.
    aliases: [tempmute]
    permission: ioricore.punish.mute
  warn:
    description: Warn a player.
    permission: ioricore.punish.warn
  kick:
    description: Kick a player.
    permission: ioricore.punish.kick
  unban:
    description: Revoke an active ban.
    aliases: [pardon]
    permission: ioricore.punish.unban
  unmute:
    description: Revoke an active mute.
    permission: ioricore.punish.unmute
  unwarn:
    description: Revoke an active warn.
    permission: ioricore.punish.unwarn
  punish:
    description: Open punish menu for a player.
    permission: ioricore.punish.menu
  staff:
    description: Staff chat, mode, and login (register/login/oauth).
    permission: ioricore.staff
  staffreg:
    description: Legacy alias for Discord staff link (/staff oauth).
    permission: ioricore.staffreg
  staffmode:
    description: Toggle staff mode (IoriCore — not EssentialsX).
    aliases: [sm, mod]
    permission: ioricore.staffmode
  staffchat:
    description: Toggle staff chat.
    aliases: [sc]
    permission: ioricore.staffchat.send
  settings:
    description: Open player settings menu.
    aliases: [preferencias]
    permission: ioricore.settings
  heal:
    description: Heal a player.
    permission: ioricore.essentials.heal
  feed:
    description: Feed a player.
    permission: ioricore.essentials.feed
  fly:
    description: Toggle flight.
    permission: ioricore.essentials.fly
  god:
    description: Toggle god mode.
    permission: ioricore.essentials.god
  gamemode:
    description: Change gamemode.
    aliases: [gm, gms, gmc, gma, gmsp]
    permission: ioricore.essentials.gamemode
  speed:
    description: Change walk/fly speed.
    permission: ioricore.essentials.speed
  kill:
    description: Kill a player.
    aliases: [suicide]
    permission: ioricore.essentials.kill
  weather:
    description: Change weather.
    aliases: [sun, rain, thunder]
    permission: ioricore.essentials.weather
  time:
    description: Change time.
    aliases: [day, night]
    permission: ioricore.essentials.time
  top:
    description: Teleport to highest block.
    permission: ioricore.essentials.top
  world:
    description: Switch worlds.
    permission: ioricore.essentials.world
  tp:
    description: Teleport to a player.
    aliases: [teleport]
    permission: ioricore.essentials.tp
  tphere:
    description: Teleport a player to you.
    permission: ioricore.essentials.tphere
  back:
    description: Return to previous location.
    permission: ioricore.essentials.back
  nick:
    description: Change nickname.
    aliases: [nickname]
    permission: ioricore.essentials.nick
  repair:
    description: Repair held item.
    aliases: [fix]
    permission: ioricore.essentials.repair
  enderchest:
    description: Open ender chest.
    aliases: [ec, echest]
    permission: ioricore.essentials.enderchest
  spawn:
    description: Teleport to spawn.
    permission: ioricore.essentials.spawn
  setspawn:
    description: Set spawn.
    permission: ioricore.essentials.setspawn
  home:
    description: Teleport home.
    permission: ioricore.essentials.home
  sethome:
    description: Set a home.
    permission: ioricore.essentials.sethome
  delhome:
    description: Delete a home.
    aliases: [deletehome]
    permission: ioricore.essentials.delhome
  homes:
    description: List homes.
    permission: ioricore.essentials.homes
  warp:
    description: Teleport to a warp.
    aliases: [warps]
    permission: ioricore.essentials.warp
  setwarp:
    description: Set a warp.
    permission: ioricore.essentials.setwarp
  delwarp:
    description: Delete a warp.
    aliases: [deletewarp]
    permission: ioricore.essentials.delwarp
  tpa:
    description: Request teleport.
    permission: ioricore.essentials.tpa
  tpahere:
    description: Request teleport here.
    permission: ioricore.essentials.tpahere
  tpaccept:
    description: Accept teleport request.
    aliases: [tpyes]
    permission: ioricore.essentials.tpaccept
  tpdeny:
    description: Deny teleport request.
    aliases: [tpno]
    permission: ioricore.essentials.tpdeny
  msg:
    description: Private message.
    aliases: [tell, w, whisper, message]
    permission: ioricore.essentials.msg
  reply:
    description: Reply to private message.
    aliases: [r]
    permission: ioricore.essentials.reply
  vanish:
    description: Toggle vanish.
    aliases: [v]
    permission: ioricore.essentials.vanish
  whitelist:
    description: Manage the server whitelist.
    permission: ioricore.whitelist
  invsee:
    description: View a player inventory.
    permission: ioricore.essentials.invsee
  clear:
    description: Clear inventory.
    aliases: [ci, clearinventory]
    permission: ioricore.essentials.clear
  broadcast:
    description: Broadcast a message.
    aliases: [bc, bcast]
    permission: ioricore.essentials.broadcast
  whitelist:
    description: Manage the server whitelist.
    aliases: [wl]
    permission: ioricore.whitelist
  healall:
    description: Heal all online players.
    permission: ioricore.essentials.healall
  tpall:
    description: Teleport visible players to you.
    aliases: [teleportall]
    permission: ioricore.essentials.tpall
  gender:
    description: Set your chat gender icon.
    permission: ioricore.gender
  give:
    description: Give an item.
    aliases: [i, item]
    permission: ioricore.essentials.give
  getpos:
    description: Show coordinates.
    aliases: [coords, position]
    permission: ioricore.essentials.getpos
  disposal:
    description: Open a disposal chest.
    aliases: [trash, disposalchest]
    permission: ioricore.essentials.disposal
  kit:
    description: Claim or list kits.
    aliases: [kits]
    permission: ioricore.essentials.kit
  createkit:
    description: Create a kit from inventory.
    aliases: [kitcreate]
    permission: ioricore.essentials.createkit
  deletekit:
    description: Delete a kit.
    aliases: [kitdelete]
    permission: ioricore.essentials.deletekit
  workbench:
    description: Open a crafting table.
    aliases: [craft, wb, craftingtable]
    permission: ioricore.essentials.workbench
  hat:
    description: Wear held item as helmet.
    permission: ioricore.essentials.hat
  near:
    description: List nearby players.
    permission: ioricore.essentials.near
  ping:
    description: Show ping.
    permission: ioricore.essentials.ping
  realname:
    description: Resolve nickname to real name.
    permission: ioricore.essentials.realname
  tpcancel:
    description: Cancel outgoing teleport request.
    aliases: [tpacancel, tpc]
    permission: ioricore.essentials.tpcancel
  tppos:
    description: Teleport to coordinates.
    aliases: [teleportpos]
    permission: ioricore.essentials.tppos
  me:
    description: Broadcast an action.
    aliases: [action]
    permission: ioricore.essentials.me
  ignore:
    description: Ignore private messages.
    permission: ioricore.essentials.ignore
  skull:
    description: Give a player skull.
    aliases: [head]
    permission: ioricore.essentials.skull
  scoreboard:
    description: Toggle sidebar scoreboard.
    aliases: [sb, sidebar]
    permission: ioricore.scoreboard
  balance:
    description: Show balance.
    aliases: [money, bal]
    permission: ioricore.economy.balance
  pay:
    description: Pay another player.
    permission: ioricore.economy.pay
  eco:
    description: Economy admin.
    aliases: [economy]
    permission: ioricore.economy.eco
  tag:
    description: List and equip chat tags.
    aliases: [tags]
    permission: ioricore.tags
  coinshop:
    description: Open the coin shop.
    aliases: [shop, tienda]
    permission: ioricore.coinshop
  chatgames:
    description: ChatGames help / admin controls.
    aliases: [cg, chatgame]
    permission: ioricore.chatgames
