ID: kits
TITLE: "&8Kits"
ROWS: 4
TYPE: CHEST
BORDER: true

SOUND:
  OPEN: UI-CLICK
  CLICK: UI-CLICK

FILLER:
  MATERIAL: STAINED_GLASS_PANE
  DATA: 7
  NAME: " "
  GLOW: false

DYNAMIC:
  SOURCE: kits.enabled
  SLOTS: ["10-16", "19-25"]
  TEMPLATE:
    MATERIAL: CHEST
    NAME: "&e{kit}"
    LORE:
      - "&7&m-----------------------"
      - "&7Permiso: &f{permission}"
      - "&7Cooldown: &f{cooldown}"
      - "&7Listo: &f{ready}"
      - ""
      - "&eClic para reclamar"
      - "&7&m-----------------------"
    ACTIONS:
      ANY: ["[internal] kits.give {kit}"]

ITEMS:
  CLOSE:
    SLOT: 31
    MATERIAL: REDSTONE_BLOCK
    MATERIAL-FALLBACK: REDSTONE_BLOCK
    NAME: "&cClose"
    ACTIONS:
      ANY: ["[close]"]
