# ***
# * IoriCore | Menu RANK-LIST
# ***
# ~ Modern (protocol ≤340). 1.13–1.15 reciben modern.

ID: rank-list
TITLE-KEY: RANKS.MENU.TITLE
ROWS: 6
TYPE: CHEST
BORDER: true

SOUND:
  CLICK: UI-CLICK

FILLER:
  MATERIAL: STAINED_GLASS_PANE
  DATA: 7
  NAME: " "
  GLOW: false

ACCENT-FILLER:
  MATERIAL: STAINED_GLASS_PANE
  DATA: 3
  NAME: " "
  GLOW: false
  SLOTS: [4, 22, 40, 49]

DYNAMIC:
  SOURCE: ranks.all
  SLOTS: ["10-16", "19-25", "28-34", "37-43"]
  TEMPLATE:
    MATERIAL: NAME_TAG
    NAME-KEY: RANKS.MENU.DISPLAY-NAME
    LORE-KEY: RANKS.MENU.LORE
    ACTIONS:
      LEFT:
        - "[open] rank-edit {id}"

PAGINATION:
  PREV: 48
  NEXT: 50
  INFO: 49

ITEMS:
  PREV:
    MATERIAL: ARROW
    NAME: "&ePrevious"
  NEXT:
    MATERIAL: ARROW
    NAME: "&eNext"
  INFO:
    MATERIAL: PAPER
    NAME: "&7Page &f{page}&7/&f{pages}"
