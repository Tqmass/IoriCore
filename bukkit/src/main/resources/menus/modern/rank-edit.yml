# ***
# * IoriCore | Menu RANK-EDIT
# ***

ID: rank-edit
TITLE-KEY: RANKS.MENU.EDIT-TITLE
ROWS: 6
TYPE: CHEST
BORDER: true

SOUND:
  CLICK: UI-CLICK

FILLER:
  MATERIAL: GRAY_STAINED_GLASS_PANE
  DATA: 0
  NAME: " "
  GLOW: false

ACCENT-FILLER:
  MATERIAL: LIGHT_BLUE_STAINED_GLASS_PANE
  DATA: 0
  NAME: " "
  GLOW: false
  SLOTS: [4, 49]
ITEMS:
  INFO:
    SLOT: 4
    MATERIAL: NAME_TAG
    NAME-KEY: RANKS.MENU.EDIT-INFO-NAME
    LORE-KEY: RANKS.MENU.EDIT-INFO-LORE
  NAME:
    SLOT: 10
    MATERIAL: NAME_TAG
    NAME-KEY: RANKS.MENU.EDIT-NAME-NAME
    LORE-KEY: RANKS.MENU.EDIT-NAME-LORE
    ACTIONS:
      ANY: ["[internal] ranks.set-name"]
  DISPLAY:
    SLOT: 11
    MATERIAL: WRITABLE_BOOK
    MATERIAL-FALLBACK: BOOK_AND_QUILL
    NAME-KEY: RANKS.MENU.EDIT-DISPLAY-NAME
    LORE-KEY: RANKS.MENU.EDIT-DISPLAY-LORE
    ACTIONS:
      ANY: ["[internal] ranks.set-display"]
  WEIGHT:
    SLOT: 12
    MATERIAL: ANVIL
    NAME-KEY: RANKS.MENU.EDIT-WEIGHT-NAME
    LORE-KEY: RANKS.MENU.EDIT-WEIGHT-LORE
    ACTIONS:
      ANY: ["[internal] ranks.set-weight"]
  PREFIX:
    SLOT: 13
    MATERIAL: OAK_SIGN
    MATERIAL-FALLBACK: SIGN
    NAME-KEY: RANKS.MENU.EDIT-PREFIX-NAME
    LORE-KEY: RANKS.MENU.EDIT-PREFIX-LORE
    ACTIONS:
      ANY: ["[internal] ranks.set-prefix"]
  SUFFIX:
    SLOT: 14
    MATERIAL: PAPER
    NAME-KEY: RANKS.MENU.EDIT-SUFFIX-NAME
    LORE-KEY: RANKS.MENU.EDIT-SUFFIX-LORE
    ACTIONS:
      ANY: ["[internal] ranks.set-suffix"]
  COLOR:
    SLOT: 15
    MATERIAL: RED_DYE
    MATERIAL-FALLBACK: INK_SACK
    NAME-KEY: RANKS.MENU.EDIT-COLOR-NAME
    LORE-KEY: RANKS.MENU.EDIT-COLOR-LORE
    ACTIONS:
      LEFT: ["[internal] ranks.cycle-color"]
      SHIFT_LEFT: ["[internal] ranks.cycle-color anvil"]
      SHIFT_RIGHT: ["[internal] ranks.cycle-color anvil"]
  BOLD:
    SLOT: 16
    MATERIAL: GOLD_BLOCK
    NAME-KEY: RANKS.MENU.EDIT-BOLD-NAME
    LORE-KEY: RANKS.MENU.EDIT-BOLD-LORE
    ACTIONS:
      ANY: ["[internal] ranks.toggle-bold"]
  ITALIC:
    SLOT: 19
    MATERIAL: FEATHER
    NAME-KEY: RANKS.MENU.EDIT-ITALIC-NAME
    LORE-KEY: RANKS.MENU.EDIT-ITALIC-LORE
    ACTIONS:
      ANY: ["[internal] ranks.toggle-italic"]
  DEFAULT:
    SLOT: 20
    MATERIAL: EMERALD
    NAME-KEY: RANKS.MENU.EDIT-DEFAULT-NAME
    LORE-KEY: RANKS.MENU.EDIT-DEFAULT-LORE
    ACTIONS:
      ANY: ["[internal] ranks.toggle-default"]
  STAFF:
    SLOT: 21
    MATERIAL: GOLDEN_HELMET
    MATERIAL-FALLBACK: GOLD_HELMET
    NAME-KEY: RANKS.MENU.EDIT-STAFF-NAME
    LORE-KEY: RANKS.MENU.EDIT-STAFF-LORE
    ACTIONS:
      ANY: ["[internal] ranks.toggle-staff"]
  ADMIN:
    SLOT: 22
    MATERIAL: DIAMOND_HELMET
    NAME-KEY: RANKS.MENU.EDIT-ADMIN-NAME
    LORE-KEY: RANKS.MENU.EDIT-ADMIN-LORE
    ACTIONS:
      ANY: ["[internal] ranks.toggle-admin"]
  VISIBLE:
    SLOT: 24
    MATERIAL: ENDER_EYE
    MATERIAL-FALLBACK: EYE_OF_ENDER
    NAME-KEY: RANKS.MENU.EDIT-VISIBLE-NAME
    LORE-KEY: RANKS.MENU.EDIT-VISIBLE-LORE
    ACTIONS:
      ANY: ["[internal] ranks.toggle-visible"]
  PARENTS:
    SLOT: 25
    MATERIAL: BOOK
    NAME-KEY: RANKS.MENU.EDIT-PARENTS-NAME
    LORE-KEY: RANKS.MENU.EDIT-PARENTS-LORE
    ACTIONS:
      ANY: ["[internal] ranks.open-parents"]
  BACK:
    SLOT: 49
    MATERIAL: ARROW
    NAME-KEY: RANKS.MENU.EDIT-BACK-NAME
    LORE-KEY: RANKS.MENU.EDIT-BACK-LORE
    ACTIONS:
      ANY: ["[back]"]
