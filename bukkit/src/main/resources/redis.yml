# *************************************
# *         IoriCore | Redis          *
# *************************************
# ~ Pub/sub bus with proxy (sanciones, staff sync…)

# ────────────────────────────
# CONNECTION
# ────────────────────────────
ENABLED: false
HOST: 127.0.0.1
PORT: 6379
DATABASE: 0
TIMEOUT-MS: 2000
SSL: false

# ────────────────────────────
# NAMESPACE
# ────────────────────────────
KEY-PREFIX: ioriproxy
CHANNEL: ioriproxy

# ────────────────────────────
# AUTHENTICATION
# ────────────────────────────
AUTHENTICATION:
  ENABLED: false
  USERNAME: ""
  PASSWORD: ""

# ────────────────────────────
# DISCORD-BRIDGE
# ────────────────────────────
# ~ JDA solo en proxy; Core publica por Redis (sin discord.yml).

DISCORD-BRIDGE:
  ENABLED: true
  CHANNEL-IN: "royalctw:discord:in"
  CHANNEL-OUT: "royalctw:discord:out"
  SIGN-EVENTS: true
  SECRET-ENV: "ROYALCTW_BRIDGE_SECRET"
  CODE-TTL-SECONDS: 300
  COOLDOWN-SECONDS: 30
  REDEEM-COOLDOWN-SECONDS: 5
