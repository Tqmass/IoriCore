# *************************************
# *         IoriCore | Groups         *
# *************************************

# ────────────────────────────
# RANK PREFIX AND SUFFIX
# ────────────────────────────
# ~ Tab list + nametag (scoreboard team)
# ~ Lunar multiline staff: staff-mode.yml (STAFF-MODE)
# ~ __DEFAULT__ = everyone without another group
GROUPS:
  ENABLED: true
  UPDATE-SECONDS: 5
  # ~ VAULT | PERMISSION | AUTO
  RESOLVE-BY: "AUTO"

  APOLLO:
    ENABLED: true

  RANKS:
    owner:
      PRIORITY: 1
      PERMISSION: "ioricore.group.owner"
      TAB-PREFIX: "&4&lOWNER &f"
      TAB-SUFFIX: ""
      TAG-PREFIX: "&4&lOWNER &f"
      TAG-SUFFIX: ""
      GLOW:
        ENABLED: true
        COLOR: "DARK_RED"

    admin:
      PRIORITY: 2
      PERMISSION: "ioricore.group.admin"
      TAB-PREFIX: "&cADMIN &f"
      TAB-SUFFIX: ""
      TAG-PREFIX: "&cADMIN &f"
      TAG-SUFFIX: ""
      GLOW:
        ENABLED: true
        COLOR: "RED"

    mod:
      PRIORITY: 3
      PERMISSION: "ioricore.group.mod"
      TAB-PREFIX: "&2MOD &f"
      TAB-SUFFIX: ""
      TAG-PREFIX: "&2MOD &f"
      TAG-SUFFIX: ""
      GLOW:
        ENABLED: true
        COLOR: "DARK_GREEN"

    vip:
      PRIORITY: 4
      PERMISSION: "ioricore.group.vip"
      TAB-PREFIX: "&6VIP &f"
      TAB-SUFFIX: ""
      TAG-PREFIX: "&6VIP &f"
      TAG-SUFFIX: ""
      GLOW:
        ENABLED: true
        COLOR: "GOLD"

    __DEFAULT__:
      PRIORITY: 99
      TAB-PREFIX: "&7"
      TAB-SUFFIX: ""
      TAG-PREFIX: "&7"
      TAG-SUFFIX: ""
      GLOW:
        ENABLED: false
        COLOR: "GRAY"
