# *************************************
# *         IoriCore | Tags           *
# *************************************
# ~ Definiciones de tags (equipados en tags/players/{uuid}.yml)
# ~ DISPLAY = nombre en menús · EMOJI = símbolo suelto · CHAT = fragmento en el chat
# ~ PERMISSION = ioricore.tags.<id>
# ~ PRICE + MATERIAL + DATA = tienda /coinshop (TAG) — 0 = no en tienda
# ~ CONFIG-VERSION: migración desde data/coinshop.yml

CONFIG-VERSION: 1

