  APPLIED: "<prefix>&aApplied &f<type> &ato &f<player>&a · &7<reason>"
  USAGE:
    - "&7&m------------------------------------------&r"
    - "&8• &f/punish <player> &7- &eOpen punish reason menu."
    - "&7&m------------------------------------------&r"

# — PUNISHMENTS —————————————————
# ~ RED theme (black/white/red) rewrite · RoyalCTW
PUNISHMENTS:
  PREFIX: "&8(&6&lSANCTIONS&8) &8· &r"
  NO-REASON: "No reason was specified."
  PLAYER-NOT-FOUND: "<prefix>&cPlayer &f<player> &cwas not found."
  PLAYER-OFFLINE: "<prefix>&cPlayer &f<player> &cis offline."
  DURATION-INVALID: "<prefix>&cInvalid duration. Use &f1h&c, &f1d&c, &f7d&c…"
  PUNISHMENT-NOT-FOUND: "<prefix>&cNo punishment found for &f<id>&c."
  NOT-ACTIVE: "<prefix>&cNo active &f<type> &cfor &f<player>&c."
  ALREADY-ACTIVE: "<prefix>&c<player> ya tiene un &f<type> &cactivo · &8#<id> &8(&f<expires>&8)"
  PUNISH:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/punish <player> &7- &eOpen punish reason menu."
      - "&7&m------------------------------------------&r"
  EXPIRES-NEVER: "&cPermanent"
  BROADCAST:
    - ""
    - "&c&l⚠ PUNISHMENT ALERT"
    - "&8&m------------------------------------------&r"
    - "&8• &fPlayer: &c<player>"
    - "&8• &fType: &c<type>"
    - "&8• &fReason: &c<reason>"
    - "&8• &fBy: &c<actor>"
    - "&8• &fExpires: &c<expires>"
    - "&8• &fID: &c#<id>"
    - "&8&m------------------------------------------&r"
  BAN:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/ban <player> [duration] [-s] [reason] &7- &eBan a player."
      - "&8• &f/tempban <player> <duration> [-s] [reason] &7- &eTemporary ban."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&cBanned &f<player>&c · &8#<id> &8(&f<expires>&8)"
    SCREEN:
      - ""
      - "&c&lRoyalCTW &8· &cAccess denied"
      - "&8&m------------------------------------------&r"
      - ""
      - "&8• &fReason: &c<reason>"
      - "&8• &fStaff: &c<actor>"
      - "&8• &fExpires: &c<expires>"
      - ""
      - "&7Appeal at &cdiscord.royalctw.com"
      - ""
  MUTE:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/mute <player> [duration] [-s] [reason] &7- &eMute a player."
      - "&8• &f/tempmute <player> <duration> [-s] [reason] &7- &eTemporary mute."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&cMuted &f<player>&c · &8#<id> &8(&f<expires>&8)"
    NOTIFY:
      - ""
      - "&c&lYou have been muted"
      - "&8&m------------------------------------------&r"
      - ""
      - "&8• &fReason: &c<reason>"
      - "&8• &fStaff: &c<actor>"
      - "&8• &fExpires: &c<expires>"
      - ""
    BLOCKED: "<prefix>&cYou are muted. &8Reason: &f<reason>"
  WARN:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/warn <player> [-s] [reason] &7- &eWarn a player."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&cWarned &f<player>&c · &8#<id>"
    NOTIFY:
      - ""
      - "&c&lYou have been warned"
      - "&8&m------------------------------------------&r"
      - ""
      - "&8• &fReason: &c<reason>"
      - "&8• &fStaff: &c<actor>"
      - ""
  KICK:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/kick <player> [-s] [reason] &7- &eKick a player."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&cKicked &f<player>&c · &8#<id>"
    SCREEN:
      - ""
      - "&c&lRoyalCTW &8· &cKicked"
      - "&8&m------------------------------------------&r"
      - ""
      - "&8• &fReason: &c<reason>"
      - "&8• &fStaff: &c<actor>"
      - ""
  UNBAN:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/unban <player|id> &7- &eRevoke an active ban."
      - "&8• &f/pardon <player|id> &7- &eAlias for unban."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&aUnbanned &f<player>&a · &8#<id>"
  UNMUTE:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/unmute <player|id> &7- &eRevoke an active mute."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&aUnmuted &f<player>&a · &8#<id>"
    NOTIFY:
      - ""
      - "&a&l   MUTE LIFTED"
      - "&8&m------------------------------------------&r"
      - ""
      - "&a   ●&8・&fBy: &a<actor>"
      - "&a   ●&8・&fPunishment: &a#<id>"
      - "&a"
  UNWARN:
    USAGE:
      - "&7&m------------------------------------------&r"
      - "&8• &f/unwarn <player|id> &7- &eRevoke an active warn."
      - "&7&m------------------------------------------&r"
    SUCCESS: "<prefix>&aUnwarned &f<player>&a · &8#<id>"

