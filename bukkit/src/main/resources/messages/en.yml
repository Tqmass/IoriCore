  PLAYER-ONLY: "<prefix>&cOnly players can use this command."
  UNKNOWN-COMMAND: "<prefix>&cUnknown command."
  FEATURE-DISABLED: "<prefix>&cThis feature is disabled."
  RELOAD-SUCCESS: "<prefix>&aConfiguration reloaded."

# — WHITELIST ————————————————————
WHITELIST:
  USAGE:
    - "&7&m------------------------------------------&r"
    - "&8• &f/whitelist &7- &eList players."
    - "&8• &f/whitelist list &7- &eList players."
    - "&8• &f/whitelist add <player> &7- &eAdd a player."
    - "&8• &f/whitelist remove <player> &7- &eRemove a player."
    - "&8• &f/whitelist on|off &7- &eEnable / disable."
