  ENABLED: "<prefix>&aWhitelist enabled."
  DISABLED: "<prefix>&cWhitelist disabled."
  ADDED: "<prefix>&aAdded &f<player> &ato the whitelist."
  REMOVED: "<prefix>&cRemoved &f<player> &cfrom the whitelist."
  ALREADY: "<prefix>&e<player> &7is already whitelisted."
  NOT-LISTED: "<prefix>&e<player> &7is not whitelisted."
  INVALID-NAME: "<prefix>&cInvalid name &f<player>&c."

# — CORE ———————————————————————
CORE:
  USAGE:
    - "&7&m------------------------------------------&r"
    - "&8• &f/ioricore reload &7- &eReload configs, messages and modules."
    - "&8• &f/ioricore version &7- &eShow plugin and server version."
    - "&8• &f/ioricore modules &7- &eList modules and their state."
    - "&7&m------------------------------------------&r"
