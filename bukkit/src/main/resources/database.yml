# *************************************
# *       IoriCore | Database         *
# *************************************
# ~ NONE  = YAML en data/ (punishments.yml, etc.) — default local
# ~ MYSQL = ic_* compartido con el proxy (bans de red)
# ~ H2 eliminado

# ────────────────────────────
# TYPE (NONE | MYSQL | MONGODB) · prioridad: settings.yml DATABASE.TYPE
# ────────────────────────────
TYPE: NONE

DATABASE: NONE

# ────────────────────────────
# MYSQL / MARIADB
# ────────────────────────────
MYSQL:
  HOST: 127.0.0.1
  PORT: 3306
  DATABASE: ioricore
  USERNAME: root
  PASSWORD: ""
  SSL: false
  POOL-SIZE: 5
  MIN-IDLE: 1
  CONNECTION-TIMEOUT-MS: 15000
  MAX-LIFETIME-MS: 1800000

# ────────────────────────────
# MONGODB (soft paralelo; no sustituye sanciones)
# ────────────────────────────
MONGODB:
  ENABLED: false
  URI: "mongodb://127.0.0.1:27017/ioricore"
  HOST: 127.0.0.1
  PORT: 27017
  DATABASE: ioricore
