    - "&7&m------------------------------------------&r"

# — ACCOUNT-TRANSFER ————————————
ACCOUNT-TRANSFER:
  USAGE: "&8• &f/transfer <from> <to> &7- &eMigrate friends, playtime, whitelist and IPs."
